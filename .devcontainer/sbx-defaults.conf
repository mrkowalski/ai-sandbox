# sbx defaults - the config every project starts from.
#
# A project's .sbx/config is applied on top: its `tools` and `host-network`
# replace these, its `allow` adds hosts, its `deny` removes them. Edit this
# file to widen every project at once; it is not part of the image, so no
# rebuild is needed.
#
# Keys (one `key = value` per line, `#` comments; parsed, never sourced):
#   tools = <name> ...        bundles from .devcontainer/tools/ (none by default)
#   allow = <entry>           hostname, or public IPv4 address / CIDR (/16 or narrower)
#   deny = <entry>            remove an entry from the whitelist
#   host-network = on | off   accept the Docker host's /24 (default off)
#   mount = <abs path>[:rw]   bind a host folder at the same path, read-only unless :rw

tools =

# npm registry: project dependency installs.
allow = registry.npmjs.org

# PyPI: `uv run` inline dependencies. pypi.org serves the index,
# files.pythonhosted.org the wheels and sdists. Interpreters are baked into the
# image; their download host (github.com) stays blocked.
# Caveat: the ipset holds IPs, and upload.pypi.org can share Fastly addresses
# with pypi.org. Uploading needs a PyPI token, which the sandbox does not have.
allow = pypi.org
allow = files.pythonhosted.org

# Cloudflare docs.
allow = developers.cloudflare.com
allow = docs.mcp.cloudflare.com
