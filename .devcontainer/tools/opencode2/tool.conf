# opencode v2 (npm @opencode/cli), next to the `opencode` bundle, which stays on
# v1 (opencode-ai). Its baked config dir (/etc/sbx/opencode2) loads the sandbox
# policy and the v2 host-only guard plugin.
#
# v2 keeps v1's XDG directory names, so these volumes sit at the same paths as
# the `opencode` bundle's and the launcher refuses `tools = opencode opencode2`
# (a container path declared twice). The volumes are still this bundle's own
# (sbx-opencode2-<kind>-...): v2 never opens a v1 database.
#
# ~/.cache/opencode holds binaries it executes (opencode-pty), so it is a
# volume, not a noexec tmpfs. Bun unpacks the TUI's native library into
# BUN_TMPDIR (default /tmp, noexec) and dlopens it, so it points at that
# volume. The probe is the model catalogue: the provider is project config.
type = agent
bin = opencode2
acp = opencode2 acp
volume = config:/home/node/.config/opencode
volume = data:/home/node/.local/share/opencode
volume = state:/home/node/.local/state/opencode
volume = cache:/home/node/.cache/opencode
env = OPENCODE_CONFIG_DIR=/etc/sbx/opencode2
env = BUN_TMPDIR=/home/node/.cache/opencode
probe = https://models.opencode.ai/
