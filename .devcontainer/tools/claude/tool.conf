# Claude Code. Permissions are bypassed by the baked managed settings, so
# `claude` and `claude-agent-acp` need no flag.
type = agent
bin = claude
bin = claude-agent-acp
acp = claude-agent-acp
volume = config:/home/node/.claude
env = CLAUDE_CONFIG_DIR=/home/node/.claude
env = DISABLE_UPDATES=1
env = DISABLE_AUTOUPDATER=1
probe = https://api.anthropic.com/v1/messages
