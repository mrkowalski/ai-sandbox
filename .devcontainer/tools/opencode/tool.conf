# opencode. Its baked config dir (/etc/sbx/opencode) loads the sandbox policy
# and the host-only guard plugin. ~/.cache/opencode holds downloaded binaries
# it executes, so it is a volume, not a noexec tmpfs. Bun unpacks the TUI's
# native library into BUN_TMPDIR (default /tmp, noexec) and dlopens it, so it
# points at that volume; the directory must already exist. The probe is the
# model catalogue: the provider is project config, so the bundle cannot name it.
type = agent
bin = opencode
acp = opencode acp
volume = config:/home/node/.config/opencode
volume = data:/home/node/.local/share/opencode
volume = state:/home/node/.local/state/opencode
volume = cache:/home/node/.cache/opencode
env = OPENCODE_CONFIG_DIR=/etc/sbx/opencode
env = BUN_TMPDIR=/home/node/.cache/opencode
probe = https://models.opencode.ai/
